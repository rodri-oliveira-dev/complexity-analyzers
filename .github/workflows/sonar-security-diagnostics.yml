name: Sonar Security Diagnostics

on:
  push:
    branches:
      - chore/promote-analyzer-to-root
    paths:
      - '.github/workflows/sonar-security-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Sonar security findings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query unresolved PR issues
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: rodri-oliveira-dev_complexity-analyzers
          SONAR_PULL_REQUEST: '7'
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/issues/search" \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "pullRequest=${SONAR_PULL_REQUEST}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=100")

          echo "Unresolved Sonar issues affecting security:"
          echo "${response}" | jq '{
            total,
            issues: [
              .issues[]
              | select(
                  .type == "VULNERABILITY"
                  or any(.impacts[]?; .softwareQuality == "SECURITY")
                )
              | {
                  key,
                  rule,
                  severity,
                  type,
                  message,
                  component,
                  line,
                  impacts
                }
            ]
          }'
