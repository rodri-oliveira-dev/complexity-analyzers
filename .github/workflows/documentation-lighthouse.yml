name: Documentation Lighthouse

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/documentation-lighthouse.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/documentation-lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality gates
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build
        working-directory: website
        run: npm ci --ignore-scripts && npm run build
      - name: Start production preview
        working-directory: website
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/complexity-docs-preview.log 2>&1 &
          echo $! > /tmp/complexity-docs-preview.pid
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/complexity-analyzers/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/complexity-docs-preview.log
          exit 1
      - name: Collect three runs per page
        working-directory: website
        run: npm run lighthouse:collect
      - name: Enforce budgets
        working-directory: website
        run: npm run lighthouse:assert
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-lighthouse
          path: website/.lighthouseci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Stop preview
        if: always()
        shell: bash
        run: test ! -f /tmp/complexity-docs-preview.pid || kill "$(cat /tmp/complexity-docs-preview.pid)" 2>/dev/null || true
