name: Complexity Analyzers CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_complexity_regression:
        description: Compare the sample against its reviewed complexity snapshot
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  quality:
    name: Quality
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Build
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~AnalyzerPackageContractTests&FullyQualifiedName!~ToolPackageContractTests&FullyQualifiedName!~PerformanceSyntheticCorpusTests"

  package:
    name: Package
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Build
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore

      - name: Pack
        run: >
          dotnet pack src/ComplexityAnalysis.Analyzers/ComplexityAnalysis.Analyzers.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack project-level tool
        run: >
          dotnet pack src/ComplexityAnalysis.Tool/ComplexityAnalysis.Tool.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Contract tests
        run: >
          dotnet test ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-build
          --filter "AnalyzerPackageContractTests|ToolPackageContractTests"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: complexity-analyzers-nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  compatibility:
    name: Compatibility (${{ matrix.sdk }})
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15
    needs: package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 8.0.x
            target_framework: net8.0
          - sdk: 9.0.x
            target_framework: net9.0
          - sdk: 10.0.x
            target_framework: net10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK host
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: complexity-analyzers-nupkg
          path: ${{ runner.temp }}/complexity-analyzers-packages

      - name: Build consumer with local analyzer package
        shell: pwsh
        env:
          TARGET_FRAMEWORK: ${{ matrix.target_framework }}
        run: >
          ./eng/Validate-AnalyzerPackageConsumer.ps1
          -PackageSource "${{ runner.temp }}/complexity-analyzers-packages"
          -PackageVersion "${{ env.PACKAGE_VERSION }}"
          -TargetFramework "$env:TARGET_FRAMEWORK"
          -ConsumerDirectory "${{ runner.temp }}/complexity-analyzers-consumer"
          -ArtifactsDirectory "${{ runner.temp }}/complexity-analyzers-consumer/artifacts"

      - name: Upload consumer smoke log
        uses: actions/upload-artifact@v7
        with:
          name: consumer-smoke-${{ matrix.sdk }}
          path: ${{ runner.temp }}/complexity-analyzers-consumer/artifacts/consumer-build.log
          if-no-files-found: error

  performance:
    name: Performance
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Build
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore

      - name: Structural performance harness
        run: >
          dotnet test ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-build
          --filter PerformanceSyntheticCorpusTests

      - name: Analyzer execution reporting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance
          dotnet build ./performance/ComplexityAnalysis.Analyzers.Performance/ComplexityAnalysis.Analyzers.Performance.csproj \
            --configuration Release \
            --no-restore \
            -t:Rebuild \
            -p:ReportAnalyzer=true \
            -p:UseSharedCompilation=false \
            -v:detailed \
            | tee artifacts/performance/report-analyzer.log

          grep -F "ComplexityAnalysis.Analyzers.ComplexityAnalyzer" artifacts/performance/report-analyzer.log

      - name: Upload analyzer reporting log
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-reporting
          path: artifacts/performance/report-analyzer.log
          if-no-files-found: error

  regression:
    name: Complexity regression
    if: github.event_name == 'workflow_dispatch' && inputs.run_complexity_regression
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Build
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore

      - name: Generate current snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/regression -Force | Out-Null
          dotnet run --project ./src/ComplexityAnalysis.Tool/ComplexityAnalysis.Tool.csproj `
            --configuration Release `
            --no-build `
            -- analyze ./samples/ComplexityAnalysis.Sample/ComplexityAnalysis.Sample.csproj `
            --format json `
            --snapshot `
            --output ./artifacts/regression/current.json

      - name: Compare reviewed baseline
        shell: pwsh
        run: |
          dotnet run --project ./src/ComplexityAnalysis.Tool/ComplexityAnalysis.Tool.csproj `
            --configuration Release `
            --no-build `
            -- compare ./performance/baselines/ComplexityAnalysis.Sample.snapshot.json `
            ./artifacts/regression/current.json `
            --format json `
            --output ./artifacts/regression/comparison.json `
            --fail-on-regression

      - name: Write regression summary
        if: always()
        shell: pwsh
        run: |
          "## Complexity regression" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path ./artifacts/regression/comparison.json) {
            $report = Get-Content ./artifacts/regression/comparison.json -Raw | ConvertFrom-Json
            $counts = $report.Findings | Group-Object Classification | Sort-Object Name
            "" >> $env:GITHUB_STEP_SUMMARY
            "| Classification | Count |" >> $env:GITHUB_STEP_SUMMARY
            "| --- | ---: |" >> $env:GITHUB_STEP_SUMMARY
            foreach ($count in $counts) {
              "| $($count.Name) | $($count.Count) |" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          else {
            "" >> $env:GITHUB_STEP_SUMMARY
            "Comparison output was not produced." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complexity-regression
          path: |
            performance/baselines/ComplexityAnalysis.Sample.snapshot.json
            artifacts/regression/*.json
          if-no-files-found: error
