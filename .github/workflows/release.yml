name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v1.0.0 or v1.1.0-beta.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-pack:
    name: Validate, build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version.outputs.package_version }}
      release-tag: ${{ steps.version.outputs.release_tag }}
      should-publish: ${{ steps.version.outputs.should_publish }}
      is-manual-release: ${{ steps.version.outputs.is_manual_release }}
      safe-to-publish: ${{ steps.package.outputs.safe_to_publish }}
      nuget-publishing-enabled: ${{ steps.nuget-publishing.outputs.nuget_publishing_enabled }}
      nuget-publishing-reason: ${{ steps.nuget-publishing.outputs.nuget_publishing_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate release request
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_BRANCH: main
        run: bash scripts/resolve-release-request.sh

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Validate package identity for publication
        id: package
        shell: bash
        run: |
          set -euo pipefail

          project='src/ComplexityAnalysis.Analyzers/ComplexityAnalysis.Analyzers.csproj'
          expected_package_id='ComplexityAnalysis.Analyzers'
          package_id="$(dotnet msbuild "$project" -nologo -getProperty:PackageId \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | tail -n 1)"

          if [[ -z "$package_id" ]]; then
            echo '::error::PackageId could not be resolved.'
            exit 1
          fi

          if [[ "$package_id" != "$expected_package_id" ]]; then
            echo "::error::Unexpected PackageId '$package_id'. Expected '$expected_package_id'."
            exit 1
          fi

          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo 'safe_to_publish=true' >> "$GITHUB_OUTPUT"

      - name: Resolve NuGet publishing opt-in
        id: nuget-publishing
        shell: bash
        env:
          SHOULD_PUBLISH: ${{ steps.version.outputs.should_publish }}
          SAFE_TO_PUBLISH: ${{ steps.package.outputs.safe_to_publish }}
          NUGET_USER: ${{ vars.NUGET_USER || 'rodri-oliveira-dev' }}
        run: bash scripts/resolve-nuget-publishing.sh

      - name: Validate resolved MSBuild version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail

          project='src/ComplexityAnalysis.Analyzers/ComplexityAnalysis.Analyzers.csproj'
          resolved_version="$(dotnet msbuild "$project" -nologo -getProperty:Version -p:Version="$PACKAGE_VERSION" \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
          resolved_package_version="$(dotnet msbuild "$project" -nologo -getProperty:PackageVersion -p:Version="$PACKAGE_VERSION" \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [[ "$resolved_version" != "$PACKAGE_VERSION" ]]; then
            echo "::error::$project resolved Version '$resolved_version' differs from release version '$PACKAGE_VERSION'."
            exit 1
          fi

          if [[ "$resolved_package_version" != "$PACKAGE_VERSION" ]]; then
            echo "::error::$project resolved PackageVersion '$resolved_package_version' differs from release version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Build release
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: >-
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore
          -p:Version="$PACKAGE_VERSION"

      - name: Run analyzer tests
        run: >-
          dotnet test ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~AnalyzerPackageContractTests&FullyQualifiedName!~PerformanceSyntheticCorpusTests"

      - name: Pack release artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: >-
          dotnet pack src/ComplexityAnalysis.Analyzers/ComplexityAnalysis.Analyzers.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:Version="$PACKAGE_VERSION"

      - name: Validate package identity and version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail

          expected="artifacts/packages/ComplexityAnalysis.Analyzers.${PACKAGE_VERSION}.nupkg"
          if [[ ! -f "$expected" ]]; then
            echo "::error::Expected package '$expected' was not produced."
            find artifacts/packages -maxdepth 1 -type f -print || true
            exit 1
          fi

      - name: Run package contract tests
        run: >-
          dotnet test ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-build
          --filter AnalyzerPackageContractTests

      - name: Run structural performance tests
        run: >-
          dotnet test ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-build
          --filter PerformanceSyntheticCorpusTests

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

  ensure-release-tag:
    name: Ensure release tag
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or verify release tag
        shell: bash
        env:
          IS_MANUAL_RELEASE: ${{ needs.build-and-pack.outputs.is-manual-release }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
          VALIDATED_SHA: ${{ github.sha }}
        run: bash scripts/ensure-release-tag.sh

  publish-nuget:
    name: Publish to NuGet.org
    needs:
      - build-and-pack
      - ensure-release-tag
    if: needs.build-and-pack.outputs.nuget-publishing-enabled == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: artifacts/packages

      - name: Exchange GitHub OIDC token for temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER || 'rodri-oliveira-dev' }}

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

  publish-github-packages:
    name: Publish to GitHub Packages
    needs:
      - build-and-pack
      - ensure-release-tag
    if: >-
      needs.build-and-pack.outputs.should-publish == 'true' &&
      needs.build-and-pack.outputs.safe-to-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: artifacts/packages

      - name: Publish package to GitHub Packages
        env:
          GITHUB_PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "$GITHUB_PACKAGE_SOURCE"
          --api-key "$GITHUB_PACKAGE_TOKEN"
          --skip-duplicate

  github-release:
    name: Create GitHub Release
    needs:
      - build-and-pack
      - ensure-release-tag
      - publish-nuget
      - publish-github-packages
    if: >-
      always() &&
      needs.build-and-pack.result == 'success' &&
      needs.ensure-release-tag.result == 'success' &&
      (
        needs.build-and-pack.outputs.nuget-publishing-enabled != 'true' ||
        needs.publish-nuget.result == 'success'
      ) &&
      (
        needs.build-and-pack.outputs.should-publish != 'true' ||
        needs.build-and-pack.outputs.safe-to-publish != 'true' ||
        needs.publish-github-packages.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: artifacts/packages

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub Release '$RELEASE_TAG' already exists; refreshing package artifact."
            gh release upload "$RELEASE_TAG" artifacts/packages/*.nupkg --repo "$GH_REPO" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            artifacts/packages/*.nupkg \
            --repo "$GH_REPO" \
            "${release_args[@]}"
