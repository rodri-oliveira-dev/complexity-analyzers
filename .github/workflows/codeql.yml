name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.label }} with CodeQL
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            label: 'C#'
            build-mode: manual
          - language: javascript-typescript
            label: JavaScript/TypeScript
            build-mode: none
          - language: actions
            label: GitHub Actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore
        if: matrix.build-mode == 'manual'
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Build for analysis
        if: matrix.build-mode == 'manual'
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: ${{ runner.temp }}/codeql-results
          upload: always
          upload-database: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 7
