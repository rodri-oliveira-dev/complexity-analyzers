name: Analyzer CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        continue-on-error: true

  validate:
    name: Validate analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Build
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore

      - name: Test with OpenCover
        run: >
          dotnet test tests/ComplexityAnalysis.Analyzers.Tests/ComplexityAnalysis.Analyzers.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings tests/sonar.runsettings
          --results-directory artifacts/coverage/validate

      - name: Verify OpenCover coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "artifacts/coverage/validate/opencover"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $files = @(Get-ChildItem -LiteralPath "artifacts/coverage/validate" -Recurse -File -Filter "coverage.opencover.xml" |
            Where-Object { $_.FullName -notlike "*$([System.IO.Path]::DirectorySeparatorChar)opencover$([System.IO.Path]::DirectorySeparatorChar)*" })

          if ($files.Count -ne 1) {
            $found = if ($files.Count -eq 0) { "<none>" } else { $files.FullName -join ", " }
            throw "Expected exactly one OpenCover report, found $($files.Count): $found"
          }

          $normalized = Join-Path $output "coverage.opencover.xml"
          Copy-Item -LiteralPath $files[0].FullName -Destination $normalized

          [xml] $coverage = Get-Content -Raw -LiteralPath $normalized
          $moduleNames = @($coverage.CoverageSession.Modules.Module | ForEach-Object { $_.ModuleName })
          $sourceFiles = @($coverage.CoverageSession.Modules.Module.Files.File | ForEach-Object { $_.fullPath })

          if ($moduleNames -notcontains "ComplexityAnalysis.Analyzers") {
            throw "OpenCover report does not contain production assembly ComplexityAnalysis.Analyzers."
          }

          $productionSourceFound = @($sourceFiles | Where-Object {
            $_ -like "*src/ComplexityAnalysis.Analyzers*" -or
            $_ -like "*src\\ComplexityAnalysis.Analyzers*"
          }).Count -gt 0

          if (-not $productionSourceFound) {
            throw "OpenCover report does not contain production source files."
          }

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-opencover
          path: artifacts/coverage/validate/opencover/coverage.opencover.xml
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify SONAR_TOKEN
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN repository secret is required."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Begin Sonar analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"rodri-oliveira-dev_complexity-analyzers"
          /o:"rodri-oliveira-dev"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}"
          /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/sonar/opencover/coverage.opencover.xml"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300

      - name: Build
        run: >
          dotnet build ComplexityAnalysis.Analyzers.slnx
          --configuration Release
          --no-restore
          --no-incremental
          --disable-build-servers

      - name: Test with OpenCover
        run: >
          dotnet test tests/ComplexityAnalysis.Analyzers.Tests/ComplexityAnalysis.Analyzers.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings tests/sonar.runsettings
          --results-directory artifacts/coverage/sonar/test

      - name: Verify OpenCover coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "artifacts/coverage/sonar/opencover"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $files = @(Get-ChildItem -LiteralPath "artifacts/coverage/sonar/test" -Recurse -File -Filter "coverage.opencover.xml")
          if ($files.Count -ne 1) {
            $found = if ($files.Count -eq 0) { "<none>" } else { $files.FullName -join ", " }
            throw "Expected exactly one OpenCover report, found $($files.Count): $found"
          }

          $normalized = Join-Path $output "coverage.opencover.xml"
          Copy-Item -LiteralPath $files[0].FullName -Destination $normalized

          [xml] $coverage = Get-Content -Raw -LiteralPath $normalized
          $moduleNames = @($coverage.CoverageSession.Modules.Module | ForEach-Object { $_.ModuleName })
          $sourceFiles = @($coverage.CoverageSession.Modules.Module.Files.File | ForEach-Object { $_.fullPath })

          if ($moduleNames -notcontains "ComplexityAnalysis.Analyzers") {
            throw "OpenCover report does not contain production assembly ComplexityAnalysis.Analyzers."
          }

          $productionSourceFound = @($sourceFiles | Where-Object {
            $_ -like "*src/ComplexityAnalysis.Analyzers*" -or
            $_ -like "*src\\ComplexityAnalysis.Analyzers*"
          }).Count -gt 0

          if (-not $productionSourceFound) {
            throw "OpenCover report does not contain production source files."
          }

      - name: End Sonar analysis
        id: sonar_end
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Report Sonar quality gate conditions
        id: sonar_quality_gate
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: rodri-oliveira-dev_complexity-analyzers
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          marker="<!-- complexity-analyzers:sonar-quality-gate -->"
          dashboard_url="https://sonarcloud.io/dashboard?id=${SONAR_PROJECT_KEY}&pullRequest=${SONAR_PULL_REQUEST}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_file="sonar-quality-gate-comment.md"

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "status=UNKNOWN" >> "${GITHUB_OUTPUT}"
            echo "lookup_failed=true" >> "${GITHUB_OUTPUT}"
            {
              echo "${marker}"
              echo "### SonarQube Cloud failure"
              echo
              echo "The SonarQube Cloud job failed before Quality Gate conditions could be fetched."
              echo
              echo "Cause: \`SONAR_TOKEN\` was not available to the workflow."
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
            exit 0
          fi

          if ! response=$(curl --fail-with-body --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/qualitygates/project_status" \
            --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
            --data-urlencode "pullRequest=${SONAR_PULL_REQUEST}"); then
            echo "status=UNKNOWN" >> "${GITHUB_OUTPUT}"
            echo "lookup_failed=true" >> "${GITHUB_OUTPUT}"
            {
              echo "${marker}"
              echo "### SonarQube Cloud failure"
              echo
              echo "The SonarQube Cloud job failed, and the workflow could not fetch Quality Gate conditions from SonarCloud."
              echo
              echo "Cause: SonarCloud Quality Gate API lookup failed."
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
            exit 0
          fi

          status=$(echo "${response}" | jq -r '.projectStatus.status // "UNKNOWN"')
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "lookup_failed=false" >> "${GITHUB_OUTPUT}"

          echo "SonarQube Cloud quality gate conditions:"
          echo "${response}" | jq '{
            status: .projectStatus.status,
            conditions: [.projectStatus.conditions[] | {
              metricKey,
              status,
              errorThreshold,
              actualValue
            }]
          }'

          failed_conditions=$(echo "${response}" | jq -r '
            [.projectStatus.conditions[]? | select(.status != "OK") |
              "- `" + .metricKey + "`: status `" + .status + "`, actual `" + (.actualValue // "n/a") + "`, threshold `" + (.errorThreshold // "n/a") + "`"
            ] | join("\n")
          ')

          condition_rows=$(echo "${response}" | jq -r '
            [.projectStatus.conditions[]? |
              "| `" + (.metricKey // "unknown") + "` | **" + (.status // "UNKNOWN") + "** | `" + (.actualValue // "n/a") + "` | `" + (.errorThreshold // "n/a") + "` |"
            ] | join("\n")
          ')

          if [ "${status}" = "OK" ]; then
            {
              echo "${marker}"
              echo "### SonarQube Cloud success"
              echo
              echo "The SonarQube Cloud Quality Gate passed for this PR."
              echo
              echo "Quality Gate status: **${status}**"
              echo
              if [ -n "${condition_rows}" ]; then
                echo "| Metric | Status | Actual | Threshold |"
                echo "| --- | --- | --- | --- |"
                echo "${condition_rows}"
                echo
              fi
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
          else
            {
              echo "${marker}"
              echo "### SonarQube Cloud failure"
              echo
              echo "The SonarQube Cloud Quality Gate failed for this PR."
              echo
              echo "Quality Gate status: **${status}**"
              echo
              if [ -n "${failed_conditions}" ]; then
                echo "Failed conditions:"
                echo "${failed_conditions}"
              else
                echo "No failing Quality Gate condition was returned by SonarCloud."
              fi
              echo
              echo "- [Open workflow run](${run_url})"
              echo "- [Open SonarQube Cloud dashboard](${dashboard_url})"
            } > "${comment_file}"
          fi

      - name: Comment Sonar failure on PR
        if: ${{ always() && failure() && github.event_name == 'pull_request' && ((steps.sonar_end.outcome == 'failure' && steps.sonar_quality_gate.outputs.status == 'ERROR') || steps.sonar_quality_gate.outputs.lookup_failed == 'true') }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- complexity-analyzers:sonar-quality-gate -->";
            const fallbackBody = [
              marker,
              "### SonarQube Cloud failure",
              "",
              "The SonarQube Cloud job failed before the workflow could prepare Quality Gate details.",
              "",
              `- [Open workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
            ].join("\n");
            const body = fs.existsSync("sonar-quality-gate-comment.md")
              ? fs.readFileSync("sonar-quality-gate-comment.md", "utf8")
              : fallbackBody;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Comment Sonar success on PR
        if: ${{ success() && github.event_name == 'pull_request' && steps.sonar_quality_gate.outputs.status == 'OK' && steps.sonar_quality_gate.outputs.lookup_failed == 'false' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- complexity-analyzers:sonar-quality-gate -->";
            const body = fs.existsSync("sonar-quality-gate-comment.md")
              ? fs.readFileSync("sonar-quality-gate-comment.md", "utf8")
              : [
                  marker,
                  "### SonarQube Cloud success",
                  "",
                  "The SonarQube Cloud Quality Gate passed for this PR.",
                  "",
                  `- [Open workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
                ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  pack:
    name: Pack analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ComplexityAnalysis.Analyzers.slnx

      - name: Pack
        run: >
          dotnet pack src/ComplexityAnalysis.Analyzers/ComplexityAnalysis.Analyzers.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:PackageVersion=0.0.0-ci.${{ github.run_number }}

      - name: Validate package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @(Get-ChildItem -LiteralPath "artifacts/packages" -File -Filter "*.nupkg")

          if ($packages.Count -ne 1) {
            $found = if ($packages.Count -eq 0) { "<none>" } else { $packages.FullName -join ", " }
            throw "Expected exactly one .nupkg, found $($packages.Count): $found"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = $packages[0].FullName
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })

            if ($entries -notcontains "analyzers/dotnet/cs/ComplexityAnalysis.Analyzers.dll") {
              throw "Analyzer assembly is missing from analyzers/dotnet/cs/."
            }

            $libEntries = @($entries | Where-Object { $_ -like "lib/*/ComplexityAnalysis.Analyzers.dll" })
            if ($libEntries.Count -ne 0) {
              throw "Analyzer assembly must not be packed under lib/: $($libEntries -join ', ')"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-nuget-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
